<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected by BrowseCurator</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="shield-container">
    <div class="shield-card">
      <!-- Friendly Icon -->
      <div class="icon-bubble">
        <svg class="shield-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#3b82f6" fill-opacity="0.15" stroke="#2563eb" />
          <path d="M9 12l2 2 4-4" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
        </svg>
      </div>

      <!-- Main Kid-Friendly Message -->
      <h1>Page Paused for Safety</h1>
      <p class="subtitle">
        BrowseCurator stopped this page.
      </p>

      <!-- Child Action Buttons -->
      <div class="action-buttons">
        <button id="goBackBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Go Back Safely
        </button>
        <button id="safeHomeBtn" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          New Tab
        </button>
      </div>

      <!-- Parent Unlock Area -->
      <div class="parent-zone">
        <div class="parent-divider">
          <span>FOR PARENTS & GUARDIANS</span>
        </div>

        <button id="toggleParentBtn" class="btn-parent-toggle">
          🔑 Parent Override / Unlock with PIN
        </button>

        <div id="parentForm" class="parent-form hidden">
          <p class="parent-hint">Enter your 4-digit parent PIN to review or unlock this website:</p>
          <div class="pin-group">
            <input type="password" id="parentPinInput" maxlength="8" placeholder="Enter PIN" autocomplete="off" />
            <button id="unlockBtn" class="btn btn-unlock">Unlock</button>
          </div>
          <p id="pinError" class="error-text hidden">Incorrect PIN. Please try again.</p>

          <div class="unlock-options">
            <label class="radio-label">
              <input type="radio" name="unlockType" value="temp" checked>
              Allow for 1 hour
            </label>
            <label class="radio-label">
              <input type="radio" name="unlockType" value="permanent">
              Always allow (Add to allowlist)
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
